<div class="flex flex-col gap-6" [formGroup]="form()">
  <div>
    <h2 class="mb-1 text-2xl font-semibold">Season Setup</h2>
    <p class="text-sm text-(--tui-text-secondary)">Choose how your regular season takes shape.</p>
  </div>

  <div>
    <label tuiLabel class="mb-2 block">Season Format</label>
    <div class="flex flex-col gap-3">
      @for (st of [SeasonType.ROUND_ROBIN_ONLY, SeasonType.BRACKET_ONLY, SeasonType.HYBRID]; track st) {
        <label
          [appearance]="form().get('Format.SeasonType')!.value === st ? 'primary' : 'secondary'"
          tuiBlock
          [class]="st === SeasonType.BRACKET_ONLY ? 'flex-1 cursor-not-allowed opacity-50' : 'flex-1'"
        >
          <input
            tuiBlock="m"
            type="radio"
            tuiRadio
            [formControl]="$any(form().get('Format.SeasonType'))"
            [value]="st"
            [attr.disabled]="st === SeasonType.BRACKET_ONLY || null"
          />
          <span tuiTitle>
            {{ st | enumLabel: seasonLabels }}
            <span tuiSubtitle>
              @switch (st) {
                @case (SeasonType.ROUND_ROBIN_ONLY) {
                  Classic league format. Everyone plays everyone else.
                }
                @case (SeasonType.BRACKET_ONLY) {
                  Simple tournament bracket. (Coming Soon)
                }
                @case (SeasonType.HYBRID) {
                  Regular season followed by a top-cut bracket.
                }
              }
            </span>
          </span>
        </label>
      }
    </div>
  </div>

  <div>
    <label tuiLabel class="mb-2 block">Groups</label>
    <div class="flex gap-2">
      @for (group of [1, 2]; track group) {
        <label
          [appearance]="form().get('Format.GroupCount')!.value === group ? 'primary' : 'secondary'"
          tuiBlock
          class="flex-1"
        >
          <input
            tuiBlock="m"
            type="radio"
            tuiRadio
            [formControl]="$any(form().get('Format.GroupCount'))"
            [value]="group"
          />
          <span tuiTitle>
            {{ group === 1 ? 'Single Group' : 'Two Groups' }}
            <span tuiSubtitle>
              @if (group === 1) {
                All players compete in one shared group.
              } @else {
                Players are split into two groups.
              }
            </span>
          </span>
        </label>
      }
    </div>
  </div>
