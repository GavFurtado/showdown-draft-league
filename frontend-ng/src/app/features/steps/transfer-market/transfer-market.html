<div class="flex flex-col gap-6" [formGroup]="form()">
  <div>
    <h2 class="mb-1 text-2xl font-semibold">Transfer Market</h2>
    <p class="text-sm text-(--tui-text-secondary)">Decide how players can swap Pokémon once the season starts.</p>
  </div>

  <label
    class="flex cursor-pointer items-center justify-between gap-4 rounded-xl border border-(--tui-border-normal) p-4"
  >
    <span tuiTitle>
      Enable Transfers
      <span tuiSubtitle>Allow players to drop and add Pokémon during the season.</span>
    </span>
    <input type="checkbox" tuiSwitch [formControl]="$any(form().get('Format.AllowTransfers'))" />
  </label>

  @if (form().get('Format.AllowTransfers')!.value) {
    <div class="flex flex-col gap-4 sm:flex-row">
      <label tuiLabel class="min-w-0 flex-1">
        Window Frequency (Days)
        <tui-textfield tuiTextfieldSize="l">
          <input
            tuiInputNumber
            [formControl]="$any(form().get('Format.TransferWindowFrequencyDays'))"
            [min]="7"
            [step]="7"
          />
        </tui-textfield>
        <span tuiSubtitle>How often a Transfer Window should open.</span>
        @if (fieldError()(form()!.get('Format.TransferWindowFrequencyDays')); as error) {
          <span class="mt-1 text-xs text-(--tui-status-negative)">{{ error }}</span>
        }
      </label>

      <label tuiLabel class="min-w-0 flex-1">
        Window Duration (Hours)
        <tui-textfield tuiTextfieldSize="l">
          <input
            tuiInputNumber
            [formControl]="$any(form().get('Format.TransferWindowDuration'))"
            [min]="1"
            [step]="1"
          />
        </tui-textfield>
        <span tuiSubtitle>How long the Transfer Window stays open.</span>
        @if (fieldError()(form()!.get('Format.TransferWindowDuration')); as error) {
          <span class="mt-1 text-xs text-(--tui-status-negative)">{{ error }}</span>
        }
      </label>
    </div>

    <label
      class="flex cursor-pointer items-center justify-between gap-4 rounded-xl border border-(--tui-border-normal) p-4"
    >
      <span tuiTitle>
        Transfers Cost Credits
        <span tuiSubtitle>Limit activity with the Transfer Credit (TC) system.</span>
      </span>
      <input type="checkbox" tuiSwitch [formControl]="$any(form().get('Format.TransfersCostCredits'))" />
    </label>

    @if (form().get('Format.TransfersCostCredits')!.value) {
      <div class="flex flex-col gap-4 sm:flex-row">
        <label tuiLabel class="min-w-0 flex-1">
          Credits / Window
          <tui-textfield tuiTextfieldSize="l">
            <input
              tuiInputNumber
              [formControl]="$any(form().get('Format.TransferCreditsPerWindow'))"
              [min]="0"
              [step]="1"
            />
          </tui-textfield>
          <span tuiSubtitle>TCs granted at the start of each window.</span>
          @if (fieldError()(form()!.get('Format.TransferCreditsPerWindow')); as error) {
            <span class="mt-1 text-xs text-(--tui-status-negative)">{{ error }}</span>
          }
        </label>

        <label tuiLabel class="min-w-0 flex-1">
          Max. Credit Cap
          <tui-textfield tuiTextfieldSize="l">
            <input tuiInputNumber [formControl]="$any(form().get('Format.TransferCreditCap'))" [min]="0" [step]="1" />
          </tui-textfield>
          <span tuiSubtitle>Maximum TCs a player can hold.</span>
          @if (fieldError()(form()!.get('Format.TransferCreditCap')); as error) {
            <span class="mt-1 text-xs text-(--tui-status-negative)">{{ error }}</span>
          }
        </label>
      </div>

      <div class="flex flex-col gap-4 sm:flex-row">
        <label tuiLabel class="min-w-0 flex-1">
          Drop Cost (Credits)
          <tui-textfield tuiTextfieldSize="l">
            <input tuiInputNumber [formControl]="$any(form().get('Format.DropCost'))" [min]="0" [step]="1" />
          </tui-textfield>
          <span tuiSubtitle>TCs spent when dropping a Pokémon.</span>
          @if (fieldError()(form()!.get('Format.DropCost')); as error) {
            <span class="mt-1 text-xs text-(--tui-status-negative)">{{ error }}</span>
          }
        </label>

        <label tuiLabel class="min-w-0 flex-1">
          Pickup Cost (Credits)
          <tui-textfield tuiTextfieldSize="l">
            <input tuiInputNumber [formControl]="$any(form().get('Format.PickupCost'))" [min]="0" [step]="1" />
          </tui-textfield>
          <span tuiSubtitle>TCs spent when picking up a Pokémon.</span>
          @if (fieldError()(form()!.get('Format.PickupCost')); as error) {
            <span class="mt-1 text-xs text-(--tui-status-negative)">{{ error }}</span>
          }
        </label>
      </div>
    }
  }
</div>
