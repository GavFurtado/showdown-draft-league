<header tuiNavigationHeader class="h-16!">
  <div class="flex min-w-0 items-center gap-1">
    <a routerLink="" tuiNavigationLogo class="no-underline">
      <tui-icon icon="@tui.home" />
      <span class="ml-1 text-lg font-bold">Draft League</span>
    </a>
    <span tuiNavigationSegments class="min-w-0! shrink-0">
      <button
        tuiButton
        type="button"
        size="s"
        routerLink="/my-leagues"
        routerLinkActive
        #rlaMyLeagues="routerLinkActive"
        [routerLinkActiveOptions]="{ fragment: 'exact' }"
        [appearance]="rlaMyLeagues.isActive ? 'primary' : 'flat'"
      >My Leagues</button>
      <button
        tuiButton
        type="button"
        size="s"
        routerLink="/my-leagues"
        [fragment]="'public'"
        routerLinkActive
        #rlaPublicLeagues="routerLinkActive"
        [routerLinkActiveOptions]="{ fragment: 'exact' }"
        [appearance]="rlaPublicLeagues.isActive ? 'primary' : 'flat'"
      >Public Leagues</button>
    </span>
  </div>

  <app-league-dropdown class="justify-self-center" />

  <div class="flex min-w-0 items-center justify-end gap-1">
    <button
      tuiButton
      type="button"
      size="s"
      routerLink="/faq"
      routerLinkActive
      #rlaFaq="routerLinkActive"
      [appearance]="rlaFaq.isActive ? 'primary' : 'flat'"
    >FAQ</button>
    <app-profile-menu />
  </div>
</header>
